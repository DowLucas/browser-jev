name: Bug report
description: Something in browser-jev itself does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command or runner request (remove tokens and keys), and the target if it is public.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The relevant log lines or report finding. Remove anything private.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA or runner image tag, and Node version.
